spring.application.name=tech-shop
spring.security.user.name=admin
spring.security.user.password=123456

server.port=8081
spring.config.import=optional:file:.env[.properties]


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



# jwt
application.security.jwt.secret-key=${JWT_SECRET_KEY:mySecretKey1234567890123456789012345678901234567890}
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000
# oauth2
spring.security.oauth2.client.registration.google.client-id=${GG_OAUTH2ID_CLIENT:}
spring.security.oauth2.client.registration.google.client-secret=${GG_OAUTH2ID_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile,openid